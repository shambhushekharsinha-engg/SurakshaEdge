services:
  - type: web
    name: surakshaedge
    runtime: python
    region: singapore
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: SURAKSHA_API_TOKEN
        value: demo-token
      - key: SURAKSHA_CONFIG
        value: configs/demo.yaml
      - key: SURAKSHA_PRODUCTION
        value: "false"
      - key: SURAKSHA_KEY
        generateValue: true
    healthCheckPath: /health
