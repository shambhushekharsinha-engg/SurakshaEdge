# GitHub Actions CI — SurakshaEdge
# Runs on every push and PR to main:
#   1. Lint with ruff
#   2. Full 51-test suite
#   3. Reports badge status

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Lint + Test (Python 3.11)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt
          pip install ruff pytest pytest-asyncio pytest-mock
          # Ensure case-insensitive package resolution on Linux runners
          ln -sfn . surakshaedge
          ln -sfn "$(pwd)" "../surakshaedge" || true

      - name: Lint — ruff
        run: ruff check .

      - name: Run test suite
        env:
          PYTHONPATH: .
          SURAKSHA_TEST_MODE: "1"
          SURAKSHA_API_TOKEN: "demo-token"
          SURAKSHA_DB: ":memory:"
        run: pytest tests/ -q --tb=short

      - name: Upload coverage (optional)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: .pytest_cache/
